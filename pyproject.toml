[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexus-personal-hub"
version = "0.3.0"
description = "A read-only Lexus personal dashboard, trip logger, and Discord companion."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Andy"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "discord.py>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
lexus-hub = "lexus_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lexus_hub"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/lexus_hub/alerts.py" = ["E402", "E501", "F401"]
"src/lexus_hub/analytics.py" = ["E402"]
"src/lexus_hub/bot.py" = ["E402", "E501"]
"src/lexus_hub/insights.py" = ["E501", "F401"]
"src/lexus_hub/poller.py" = ["E402"]
"src/lexus_hub/storage.py" = ["E402", "E501"]
"src/lexus_hub/web.py" = ["E501"]
